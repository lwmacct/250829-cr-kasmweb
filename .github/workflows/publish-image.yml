name: publish-image

on:
  workflow_call:
    inputs:
      image_channel:
        description: Image tag namespace
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_CHANNEL: ${{ inputs.image_channel }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            architecture: amd64
            artifact: digest-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
            artifact: digest-linux-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare revision
        id: revision
        run: |
          __main() {
            _full_sha=$(git rev-parse HEAD)
            printf 'full_sha=%s\n' "$_full_sha" >> "$GITHUB_OUTPUT"
            printf 'short_sha=%s\n' "${_full_sha:0:12}" >> "$GITHUB_OUTPUT"
          }
          __main

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_CHANNEL }}-latest
            type=raw,value=${{ env.IMAGE_CHANNEL }}-sha-${{ steps.revision.outputs.short_sha }}

      - name: Build and publish image digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_CHANNEL=${{ env.IMAGE_CHANNEL }}
            VCS_REF=${{ steps.revision.outputs.full_sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_CHANNEL }}-buildcache-${{ matrix.architecture }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_CHANNEL }}-buildcache-${{ matrix.architecture }},mode=max
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          set -euo pipefail
          __main() {
            mkdir -p /tmp/digests
            _digest="${{ steps.build.outputs.digest }}"
            touch "/tmp/digests/${_digest#sha256:}"
          }
          __main

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare revision
        id: revision
        run: |
          __main() {
            _full_sha=$(git rev-parse HEAD)
            printf 'short_sha=%s\n' "${_full_sha:0:12}" >> "$GITHUB_OUTPUT"
          }
          __main

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_CHANNEL }}-latest
            type=raw,value=${{ env.IMAGE_CHANNEL }}-sha-${{ steps.revision.outputs.short_sha }}

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create multi-platform manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          __main() {
            _tag_args=()
            while IFS= read -r _tag; do
              _tag_args+=("-t" "$_tag")
            done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

            _source_args=()
            for _digest in /tmp/digests/*; do
              _source_args+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$_digest")")
            done

            test "${#_source_args[@]}" -eq 2
            docker buildx imagetools create "${_tag_args[@]}" "${_source_args[@]}"
          }
          __main

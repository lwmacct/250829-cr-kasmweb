# Pre-commit hooks configuration

default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: local
    hooks:
      - id: docker-buildx-check
        name: docker buildx check Dockerfiles
        entry: bash -c 'set -euo pipefail; find containers -type f -name Dockerfile -exec docker buildx build --check -f {} . \;'
        language: system
        files: (^|/)Dockerfile$
        pass_filenames: false
